<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">概率校准：预测值与真实频率</title><desc id="desc">示意：可靠性图按概率区间统计正类比例。评估类别不平衡时，还需结合混淆矩阵、阈值与 Brier 分数。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">概率校准：预测值与真实频率</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">示意：可靠性图按概率区间统计正类比例</text><path d="M105 254L365 254" fill="none" stroke="#64748b" stroke-width="2"/><path d="M105 254L105 88" fill="none" stroke="#64748b" stroke-width="2"/><path d="M105 254L355 98" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><path d="M130 240L162 225" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M162 225L223 206" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M223 206L284 170" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M284 170L345 142" fill="none" stroke="#0f766e" stroke-width="4"/><circle cx="130" cy="240" r="5" fill="#0f766e" stroke="white" stroke-width="2"/><circle cx="162" cy="225" r="5" fill="#0f766e" stroke="white" stroke-width="2"/><circle cx="223" cy="206" r="5" fill="#0f766e" stroke="white" stroke-width="2"/><circle cx="284" cy="170" r="5" fill="#0f766e" stroke="white" stroke-width="2"/><circle cx="345" cy="142" r="5" fill="#0f766e" stroke="white" stroke-width="2"/><text x="95" y="278" fill="#64748b" font-size="12" font-weight="normal" text-anchor="start">0</text><text x="350" y="278" fill="#64748b" font-size="12" font-weight="normal" text-anchor="start">1</text><text x="200" y="290" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">预测概率</text><text x="435" y="128" fill="#1e293b" font-size="14" font-weight="normal" text-anchor="start">虚线：预测概率 = 实际频率</text><text x="435" y="168" fill="#0f766e" font-size="14" font-weight="normal" text-anchor="start">绿线：按概率分箱后的频率</text><text x="435" y="207" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">偏离虚线说明概率需校准</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">评估类别不平衡时，还需结合混淆矩阵、阈值与 Brier 分数。</text></g></svg>
