<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">决策树：一次切分</title><desc id="desc">根节点用阈值把数据分到两个子节点。示意树展示“判断条件 → 分支 → 叶子预测”；真实阈值由基尼增益选择。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">决策树：一次切分</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">根节点用阈值把数据分到两个子节点</text><rect x="294" y="78" width="172" height="53" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="380" y="111" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">特征 1 ≤ 阈值？</text><path d="M312 132L198 182" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M202.3 176.5L198 182L205.0 182.6" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M448 132L562 182" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M555.0 182.6L562 182L557.7 176.5" fill="none" stroke="#2563eb" stroke-width="2"/><text x="240" y="160" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">是</text><text x="520" y="160" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">否</text><rect x="87" y="183" width="226" height="60" rx="10" fill="#dcfce7" stroke="#86efac"/><text x="200" y="220" fill="#0f766e" font-size="17" font-weight="bold" text-anchor="middle">预测类别 0</text><rect x="447" y="183" width="226" height="60" rx="10" fill="#fef3c7" stroke="#fcd34d"/><text x="560" y="220" fill="#b45309" font-size="16" font-weight="bold" text-anchor="middle">继续按特征 2 切分</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">示意树展示“判断条件 → 分支 → 叶子预测”；真实阈值由基尼增益选择。</text></g></svg>
