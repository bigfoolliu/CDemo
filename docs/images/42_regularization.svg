<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">正则化与过拟合</title><desc id="desc">示意：模型越来越复杂时，训练误差可能继续下降。橙线右端上升表示过拟合风险；L2 强度需用验证数据选择。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">正则化与过拟合</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">示意：模型越来越复杂时，训练误差可能继续下降</text><path d="M95 250L490 250" fill="none" stroke="#64748b" stroke-width="2"/><path d="M95 250L95 84" fill="none" stroke="#64748b" stroke-width="2"/><text x="503" y="254" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">模型复杂度</text><text x="63" y="80" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">误差</text><path d="M105 145 C190 185 320 218 480 236" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M105 112 C205 190 310 226 365 220 C430 212 460 160 480 115" fill="none" stroke="#b45309" stroke-width="3"/><text x="520" y="124" fill="#2563eb" font-size="14" font-weight="normal" text-anchor="start">训练误差</text><text x="520" y="204" fill="#b45309" font-size="14" font-weight="normal" text-anchor="start">验证误差</text><text x="106" y="280" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">适度约束权重，观察验证集表现</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">橙线右端上升表示过拟合风险；L2 强度需用验证数据选择。</text></g></svg>
