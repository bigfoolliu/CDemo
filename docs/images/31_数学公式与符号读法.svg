<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">读懂一个数学公式</title><desc id="desc">先辨认量，再代入数字，最后映射到代码。示例公式是线性模型；各文档中的同名字母可能代表不同量。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">读懂一个数学公式</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">先辨认量，再代入数字，最后映射到代码</text><rect x="30.0" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="42.0" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="57.0" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">1</text><text x="44.0" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">找变量</text><text x="44.0" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">x：输入，w：权重</text><path d="M191.5 166L207.5 166" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M201.4 169.4L207.5 166L201.4 162.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="210.5" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="222.5" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="237.5" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">2</text><text x="224.5" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">读运算</text><text x="224.5" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">wx+b：乘法再加法</text><path d="M372.0 166L388.0 166" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M381.9 169.4L388.0 166L381.9 162.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="391.0" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="403.0" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="418.0" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">3</text><text x="405.0" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">代入示例</text><text x="405.0" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">2×3+1=7</text><path d="M552.5 166L568.5 166" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M562.4 169.4L568.5 166L562.4 162.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="571.5" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="583.5" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="598.5" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">4</text><text x="585.5" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">对应代码</text><text x="585.5" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">weight*x+bias</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">示例公式是线性模型；各文档中的同名字母可能代表不同量。</text></g></svg>
