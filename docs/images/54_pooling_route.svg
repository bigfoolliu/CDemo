<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">最大池化的正向选择与反向路由</title><desc id="desc">教学算例：正向记录最大值的位置，反向沿同一位置传递梯度。</desc><rect width="760" height="330" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="31" font-size="19" fill="#1e293b" font-weight="700" text-anchor="start">最大池化的正向选择与反向路由</text><text x="30" y="53" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">教学算例：正向记录最大值的位置，反向沿同一位置传递梯度。</text><text x="47" y="102" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start">激活：2×2</text><text x="315" y="102" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start">正向取最大</text><text x="552" y="102" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start">反向传梯度</text><rect x="54" y="128" width="62" height="62" fill="#ffffff" stroke="#cbd5e1"/><text x="85.0" y="165.0" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">1</text><rect x="116" y="128" width="62" height="62" fill="#dbeafe" stroke="#2563eb"/><text x="147.0" y="165.0" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="middle">4</text><rect x="54" y="190" width="62" height="62" fill="#ffffff" stroke="#cbd5e1"/><text x="85.0" y="227.0" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">3</text><rect x="116" y="190" width="62" height="62" fill="#ffffff" stroke="#cbd5e1"/><text x="147.0" y="227.0" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">2</text><text x="245" y="204" font-size="27" fill="#2563eb" font-weight="700" text-anchor="start">→</text><rect x="320" y="154" width="82" height="70" rx="10" fill="#dcfce7" stroke="#86efac"/><text x="361" y="183" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">P = 4</text><text x="361" y="207" font-size="13" fill="#0f766e" font-weight="400" text-anchor="middle">赢家右上</text><text x="463" y="204" font-size="27" fill="#2563eb" font-weight="700" text-anchor="start">→</text><rect x="550" y="128" width="62" height="62" fill="#ffffff" stroke="#cbd5e1"/><text x="581.0" y="165.0" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">0</text><rect x="612" y="128" width="62" height="62" fill="#dbeafe" stroke="#2563eb"/><text x="643.0" y="165.0" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="middle">5</text><rect x="550" y="190" width="62" height="62" fill="#ffffff" stroke="#cbd5e1"/><text x="581.0" y="227.0" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">0</text><rect x="612" y="190" width="62" height="62" fill="#ffffff" stroke="#cbd5e1"/><text x="643.0" y="227.0" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">0</text><text x="54" y="303" font-size="14" fill="#475569" font-weight="400" text-anchor="start">若后续传回梯度 5，只把 5 送到获胜格；其他三个格得到 0。</text></g></svg>
