<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">矩阵乘法：每个输出是点积</title><desc id="desc">第一行：1×5 + 2×6 = 17；第二行：3×5 + 4×6 = 39。手算尺寸与下标后，再对照 C 的一维数组索引。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">矩阵乘法：每个输出是点积</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">第一行：1×5 + 2×6 = 17；第二行：3×5 + 4×6 = 39</text><rect x="66" y="103" width="245" height="130" rx="10" fill="white" stroke="#cbd5e1"/><text x="88" y="138" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">A = [1  2]</text><text x="127" y="170" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">[3  4]</text><text x="323" y="166" fill="#2563eb" font-size="28" font-weight="bold" text-anchor="start">×</text><rect x="360" y="103" width="130" height="130" rx="10" fill="white" stroke="#cbd5e1"/><text x="382" y="138" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">[5]</text><text x="382" y="170" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">[6]</text><text x="505" y="166" fill="#2563eb" font-size="28" font-weight="bold" text-anchor="start">=</text><rect x="544" y="103" width="150" height="130" rx="10" fill="#ecfeff" stroke="#99f6e4"/><text x="560" y="138" fill="#0f766e" font-size="16" font-weight="bold" text-anchor="start">[17]</text><text x="560" y="170" fill="#0f766e" font-size="16" font-weight="bold" text-anchor="start">[39]</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">手算尺寸与下标后，再对照 C 的一维数组索引。</text></g></svg>
