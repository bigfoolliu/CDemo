<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">K 近邻示例：查询点与三个最近样本</title>
  <desc id="desc">横纵轴使用相同的每单位六十像素刻度。六个二维样本分布在左下角和右上角。查询点 q 为 0.2、0.3，k 等于 3。虚线连接的三个最近点分别为 0、0，0、1，1、0，标签均为 0。</desc>
  <rect width="760" height="420" rx="14" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#334155" font-size="14">
    <text x="30" y="31" font-size="19" font-weight="700">先找最近的三个点，再投票</text>
    <text x="30" y="52" fill="#64748b">查询点 q = (0.2, 0.3)，邻居数 k = 3；两轴等比例</text>
    <g stroke="#e2e8f0">
      <path d="M100 70V370 M160 70V370 M220 70V370 M280 70V370 M340 70V370 M400 70V370"/>
      <path d="M100 70H400 M100 130H400 M100 190H400 M100 250H400 M100 310H400 M100 370H400"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.5"><path d="M80 370H420 M100 390V60"/></g>
    <g text-anchor="middle" fill="#64748b">
      <text x="100" y="396">0</text><text x="160" y="396">1</text><text x="220" y="396">2</text>
      <text x="280" y="396">3</text><text x="340" y="396">4</text><text x="400" y="396">5</text>
      <text x="425" y="375">x</text>
    </g>
    <g text-anchor="end" fill="#64748b">
      <text x="85" y="375">0</text><text x="85" y="315">1</text><text x="85" y="255">2</text>
      <text x="85" y="195">3</text><text x="85" y="135">4</text><text x="85" y="75">5</text>
    </g>
    <text x="89" y="58">y</text>
    <g stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5">
      <path d="M112 352L100 370 M112 352L100 310 M112 352L160 370"/>
    </g>
    <g fill="#0f766e" stroke="white" stroke-width="2">
      <circle cx="100" cy="370" r="7"/><circle cx="100" cy="310" r="7"/>
      <circle cx="160" cy="370" r="7"/>
    </g>
    <g fill="#b45309" stroke="white" stroke-width="2">
      <circle cx="340" cy="130" r="7"/><circle cx="340" cy="70" r="7"/>
      <circle cx="400" cy="130" r="7"/>
    </g>
    <path d="M112 342L122 352L112 362L102 352Z" fill="#7c3aed" stroke="white" stroke-width="2"/>
    <text x="130" y="345" font-weight="700" fill="#6d28d9">q</text>
    <rect x="452" y="74" width="278" height="270" rx="10" fill="white" stroke="#e2e8f0"/>
    <text x="472" y="105" font-weight="700">图例与投票</text>
    <circle cx="480" cy="137" r="7" fill="#0f766e"/><text x="498" y="142">类别 0：三个样本</text>
    <circle cx="480" cy="169" r="7" fill="#b45309"/><text x="498" y="174">类别 1：三个样本</text>
    <path d="M480 192L490 202L480 212L470 202Z" fill="#7c3aed"/>
    <text x="498" y="207">待分类点 q</text>
    <text x="472" y="248">最近距离平方：</text>
    <text x="472" y="274">0.13、0.53、0.73</text>
    <text x="472" y="308" font-weight="700" fill="#0f766e">3 票类别 0 → 预测 0</text>
  </g>
</svg>
