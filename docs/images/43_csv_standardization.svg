<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">CSV 到独立测试：数据如何流动</title><desc id="desc">训练、验证、测试分开使用。验证集和测试集都使用训练集的标准化统计量，不重新拟合。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">CSV 到独立测试：数据如何流动</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">训练、验证、测试分开使用</text><rect x="30.0" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="42.0" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="57.0" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">1</text><text x="44.0" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">读取 CSV</text><text x="44.0" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">解析数值与标签</text><path d="M191.5 166L207.5 166" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M201.4 169.4L207.5 166L201.4 162.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="210.5" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="222.5" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="237.5" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">2</text><text x="224.5" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">训练集</text><text x="224.5" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">拟合均值和尺度</text><path d="M372.0 166L388.0 166" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M381.9 169.4L388.0 166L381.9 162.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="391.0" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="403.0" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="418.0" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">3</text><text x="405.0" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">验证集</text><text x="405.0" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">选择训练轮次</text><path d="M552.5 166L568.5 166" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M562.4 169.4L568.5 166L562.4 162.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="571.5" y="102" width="158.5" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="583.5" y="114" width="30" height="30" rx="15" fill="#dbeafe" stroke="#dbeafe"/><text x="598.5" y="135" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">4</text><text x="585.5" y="174" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="start">测试集</text><text x="585.5" y="201" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start">仅最终评估一次</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">验证集和测试集都使用训练集的标准化统计量，不重新拟合。</text></g></svg>
