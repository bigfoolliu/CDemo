<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">硬币计数的先验、似然与后验</title>
  <desc id="desc">十次训练投掷中七正三反，Beta(2,2) 先验更新为 Beta(9,5)；MLE 为 0.7，MAP 为三分之二，后验均值为九除以十四。</desc>
  <rect width="920" height="440" fill="#f7f6f2"/>
  <text x="44" y="48" font-family="sans-serif" font-size="26" fill="#203b49">10 次训练：7 正 · 3 反</text>
  <text x="44" y="79" font-family="sans-serif" font-size="16" fill="#526672">参数 p 表示正面概率；箭头表示用数据更新先验</text>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#526f82"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="42" y="128" width="218" height="94" rx="8" fill="#dceaf0" stroke="#6a8fa2" stroke-width="2"/>
    <text x="151" y="166" font-size="20" fill="#213c49">先验 Beta(2, 2)</text>
    <text x="151" y="195" font-size="15" fill="#3d5c69">更新前均值 = 0.5</text>
    <rect x="352" y="128" width="218" height="94" rx="8" fill="#f3e2d7" stroke="#b87859" stroke-width="2"/>
    <text x="461" y="166" font-size="19" fill="#59392f">似然 p⁷(1−p)³</text>
    <text x="461" y="195" font-size="15" fill="#715447">固定数据，改变 p</text>
    <rect x="662" y="128" width="218" height="94" rx="8" fill="#dfecdd" stroke="#6b9a75" stroke-width="2"/>
    <text x="771" y="166" font-size="20" fill="#264932">后验 Beta(9, 5)</text>
    <text x="771" y="195" font-size="15" fill="#416b4b">形状参数 = 2+7, 2+3</text>
  </g>
  <g stroke="#526f82" stroke-width="2.5" marker-end="url(#arrow)"><path d="M263 175 L339 175"/><path d="M572 175 L649 175"/></g>
  <text x="44" y="285" font-family="sans-serif" font-size="18" fill="#203b49">三个不同的问题，得到三个不同的点估计</text>
  <path d="M95 342 L830 342" stroke="#718c97" stroke-width="3"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <text x="95" y="375" fill="#526672">0</text><text x="830" y="375" fill="#526672">1</text>
    <circle cx="568" cy="342" r="8" fill="#678d6c"/><text x="548" y="313" fill="#345e3d">后验均值 9/14 ≈ 0.643</text>
    <circle cx="585" cy="342" r="8" fill="#b87859"/><text x="613" y="402" fill="#8b4b33">MAP 2/3 ≈ 0.667</text>
    <circle cx="610" cy="342" r="8" fill="#466e97"/><text x="692" y="313" fill="#345e80">MLE = 0.700</text>
  </g>
</svg>
