<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">中心差分步长与绝对误差</title>
  <desc id="desc">对 x 的三次方在 x 等于 1 处求导，步长从十分之一降至十的负十四次方。误差先因截断误差减小，随后因舍入与相近数相减而增大。</desc>
  <rect width="920" height="430" fill="#f7f6f2"/>
  <text x="42" y="50" font-size="26" font-family="sans-serif" fill="#233e4a">中心差分：步长越小，并不总越准</text>
  <text x="42" y="79" font-size="16" font-family="sans-serif" fill="#526775">f(x)=x³，x=1，解析导数=3；纵轴为绝对误差，取对数刻度</text>
  <g stroke="#a9b7bc" stroke-width="1"><path d="M110 120 L110 350 L860 350"/><path d="M110 160 L860 160" stroke-dasharray="4 5"/><path d="M110 240 L860 240" stroke-dasharray="4 5"/><path d="M110 320 L860 320" stroke-dasharray="4 5"/></g>
  <g fill="#526775" font-family="sans-serif" font-size="15"><text x="31" y="166">10⁻²</text><text x="31" y="246">10⁻⁶</text><text x="31" y="326">10⁻¹⁰</text><text x="114" y="380">10⁻¹</text><text x="387" y="380">10⁻⁶</text><text x="742" y="380">10⁻¹⁴</text><text x="431" y="412">差分步长 h（从大到小）</text></g>
  <path d="M140 160 L230 200 L320 280 L410 332 L500 282 L590 253 L680 200 L770 171" fill="none" stroke="#4b83a6" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#4b83a6"><circle cx="140" cy="160" r="6"/><circle cx="230" cy="200" r="6"/><circle cx="320" cy="280" r="6"/><circle cx="410" cy="332" r="7"/><circle cx="500" cy="282" r="6"/><circle cx="590" cy="253" r="6"/><circle cx="680" cy="200" r="6"/><circle cx="770" cy="171" r="6"/></g>
  <rect x="153" y="105" width="196" height="44" rx="6" fill="#f3e2d7" stroke="#b87859"/><text x="165" y="132" font-family="sans-serif" font-size="16" fill="#694333">步长大：截断误差占主导</text>
  <rect x="585" y="105" width="243" height="44" rx="6" fill="#e2e9ef" stroke="#6786a2"/><text x="597" y="132" font-family="sans-serif" font-size="16" fill="#385267">步长小：舍入与消减占主导</text>
  <text x="420" y="320" font-family="sans-serif" font-size="15" fill="#345b75">本次最小误差约 2.48×10⁻¹¹</text>
</svg>
