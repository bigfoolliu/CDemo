<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">交叉验证：轮流留出一折</title><desc id="desc">示意：四折中每折恰好担任一次验证集。每轮的标准化参数只从蓝色训练折计算；最终测试集始终隔离。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">交叉验证：轮流留出一折</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">示意：四折中每折恰好担任一次验证集</text><text x="48" y="112" fill="#1e293b" font-size="14" font-weight="normal" text-anchor="start">第 1 折</text><rect x="140" y="91" width="123" height="27" rx="4" fill="#fce7f3" stroke="#fce7f3"/><text x="201" y="110" fill="#be123c" font-size="13" font-weight="normal" text-anchor="middle">验证</text><rect x="275" y="91" width="123" height="27" rx="4" fill="#dbeafe" stroke="#dbeafe"/><text x="336" y="110" fill="#2563eb" font-size="13" font-weight="normal" text-anchor="middle">训练</text><rect x="410" y="91" width="123" height="27" rx="4" fill="#dbeafe" stroke="#dbeafe"/><text x="471" y="110" fill="#2563eb" font-size="13" font-weight="normal" text-anchor="middle">训练</text><rect x="545" y="91" width="123" height="27" rx="4" fill="#dbeafe" stroke="#dbeafe"/><text x="606" y="110" fill="#2563eb" font-size="13" font-weight="normal" text-anchor="middle">训练</text><text x="48" y="153" fill="#1e293b" font-size="14" font-weight="normal" text-anchor="start">第 2 折</text><rect x="140" y="132" width="123" height="27" rx="4" fill="#dbeafe" stroke="#dbeafe"/><text x="201" y="151" fill="#2563eb" font-size="13" font-weight="normal" text-anchor="middle">训练</text><rect x="275" y="132" width="123" height="27" rx="4" fill="#fce7f3" stroke="#fce7f3"/><text x="336" y="151" fill="#be123c" font-size="13" font-weight="normal" text-anchor="middle">验证</text><rect x="410" y="132" width="123" height="27" rx="4" fill="#dbeafe" stroke="#dbeafe"/><text x="471" y="151" fill="#2563eb" f