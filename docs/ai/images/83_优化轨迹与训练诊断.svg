<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title description">
  <title id="title">优化器轨迹与 MLP 训练诊断</title>
  <desc id="description">左图显示二次目标的等高线和 SGD、动量、Adam 的参数轨迹。右图显示固定小型 MLP 训练 40 步的损失下降及诊断数据。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243247; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52627a; }
      .panel-title { font-size: 19px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #58677c; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #dbe3ed; stroke-width: 1; }
      .sgd { stroke: #2474c6; fill: none; }
      .momentum { stroke: #e07a28; fill: none; }
      .adam { stroke: #16876d; fill: none; }
    </style>
    <clipPath id="leftPlot"><rect x="72" y="132" width="530" height="385" rx="4"/></clipPath>
    <clipPath id="rightPlot"><rect x="682" y="143" width="530" height="286" rx="4"/></clipPath>
  </defs>
  <rect width="1280" height="650" fill="#f5f7fb"/>
  <text x="40" y="43" class="title">优化器会怎样改变训练轨迹？</text>
  <text x="40" y="70" class="subtitle">相同初值与学习率，对照曲率方向上的更新；下方显示另一组小 MLP 的训练诊断。</text>
  <rect x="28" y="92" width="610" height="532" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="652" y="92" width="600" height="532" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="123" class="panel-title">二次目标：J(x,y) = ½(x² + 9y²)</text>
  <text x="680" y="123" class="panel-title">MLP：全批次 SGD，40 次更新</text>

  <g clip-path="url(#leftPlot)">
    <rect x="72" y="132" width="530" height="385" fill="#fbfcfe"/>
    <line x1="72" y1="370" x2="602" y2="370" class="grid"/>
    <line x1="200" y1="132" x2="200" y2="517" class="grid"/>
    <ellipse cx="200" cy="370" rx="74" ry="25" fill="none" stroke="#c7d8eb" stroke-width="1.5"/>
    <ellipse cx="200" cy="370" rx="148" ry="49" fill="none" stroke="#aac3df" stroke-width="1.5"/>
    <ellipse cx="200" cy="370" rx="222" ry="74" fill="none" stroke="#8eafd2" stroke-width="1.5"/>
    <ellipse cx="200" cy="370" rx="296" ry="99" fill="none" stroke="#7299c2" stroke-width="1.5"/>
    <polyline points="385,185 367,355 350,368 336,369" class="sgd" stroke-width="3"/>
    <polyline points="385,185 367,355 341,451" class="momentum" stroke-width="3"/>
    <polyline points="385,185 367,200 349,217 331,234 313,251 286,284" class="adam" stroke-width="3"/>
    <g fill="#2474c6">
      <circle cx="385" cy="185" r="5"/><circle cx="367" cy="355" r="5"/><circle cx="350" cy="368" r="5"/><circle cx="336" cy="369" r="4"/>
    </g>
    <g fill="#e07a28">
      <circle cx="385" cy="185" r="4"/><circle cx="367" cy="355" r="4"/><circle cx="341" cy="444" r="5"/>
    </g>
    <g fill="#16876d">
      <circle cx="385" cy="185" r="4"/><circle cx="367" cy="200" r="4"/><circle cx="349" cy="217" r="4"/><circle cx="331" cy="234" r="4"/><circle cx="313" cy="251" r="4"/><circle cx="286" cy="284" r="5"/>
    </g>
  </g>
  <line x1="80" y1="370" x2="595" y2="370" class="axis"/>
  <line x1="200" y1="510" x2="200" y2="140" class="axis"/>
  <text x="586" y="393" class="label">x</text>
  <text x="208" y="151" class="label">y</text>
  <text x="182" y="391" class="small">(0,0)</text>
  <text x="386" y="180" class="small">初始点 (1,1)</text>
  <text x="344" y="345" class="small">SGD 第 2 步</text>
  <text x="260" y="460" class="small">动量越过谷底</text>
  <g>
    <line x1="86" y1="552" x2="116" y2="552" class="sgd" stroke-width="4"/><text x="124" y="557" class="label">SGD</text>
    <line x1="210" y1="552" x2="240" y2="552" class="momentum" stroke-width="4"/><text x="248" y="557" class="label">动量</text>
    <line x1="333" y1="552" x2="363" y2="552" class="adam" stroke-width="4"/><text x="371" y="557" class="label">Adam</text>
  </g>
  <text x="54" y="590" class="small">不同颜色表示参数位置序列；等高线越密表示该方向曲率越大。</text>

  <g clip-path="url(#rightPlot)">
    <rect x="682" y="143" width="530" height="286" fill="#fbfcfe"/>
    <line x1="700" y1="390" x2="1192" y2="390" class="grid"/>
    <line x1="700" y1="330" x2="1192" y2="330" class="grid"/>
    <line x1="700" y1="270" x2="1192" y2="270" class="grid"/>
    <line x1="700" y1="210" x2="1192" y2="210" class="grid"/>
    <polyline points="704,176 716,198 728,216 827,270 950,294 1190,329" fill="none" stroke="#2474c6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#2474c6"><circle cx="704" cy="176" r="4"/><circle cx="716" cy="198" r="4"/><circle cx="728" cy="216" r="4"/><circle cx="827" cy="270" r="4"/><circle cx="950" cy="294" r="4"/><circle cx="1190" cy="329" r="4"/></g>
  </g>
  <line x1="700" y1="390" x2="1195" y2="390" class="axis"/>
  <line x1="700" y1="390" x2="700" y2="158" class="axis"/>
  <text x="688" y="166" class="small">损失</text>
  <text x="1182" y="412" class="small">步数</text>
  <text x="700" y="412" class="small">0</text><text x="816" y="412" class="small">10</text><text x="939" y="412" class="small">20</text><text x="1170" y="412" class="small">40</text>
  <text x="720" y="171" class="small">0.1664</text><text x="1150" y="324" class="small">0.0472</text>

  <rect x="680" y="452" width="258" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="698" y="477" class="label" font-weight="700">损失</text>
  <text x="698" y="500" class="label">0.16643 → 0.04717</text>
  <rect x="954" y="452" width="270" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="972" y="477" class="label" font-weight="700">梯度范数</text>
  <text x="972" y="500" class="label">0.40251 → 0.11510</text>
  <rect x="680" y="530" width="258" height="64" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="698" y="555" class="label" font-weight="700">第 0 步更新量</text>
  <text x="698" y="578" class="label">参数移动二范数 0.04025</text>
  <rect x="954" y="530" width="270" height="64" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="972" y="555" class="label" font-weight="700">隐藏激活范围</text>
  <text x="972" y="578" class="label">第 0 步 [-0.291, 0.291]</text>
  <text x="680" y="614" class="small">固定三条训练样本；损失下降不代表独立数据上的泛化能力。</text>
</svg>
