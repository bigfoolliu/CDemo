<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">XOR：为什么需要隐藏层</title><desc id="desc">示意：四个输入点的标签交错分布。MLP 用隐藏层组合多个线性切分，再输出非线性类别概率。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">XOR：为什么需要隐藏层</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">示意：四个输入点的标签交错分布</text><path d="M105 171L105 255" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="105" y="277" fill="#64748b" font-size="12" font-weight="normal" text-anchor="middle">0</text><path d="M147 171L147 255" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="147" y="277" fill="#64748b" font-size="12" font-weight="normal" text-anchor="middle">1</text><path d="M189 171L189 255" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="189" y="277" fill="#64748b" font-size="12" font-weight="normal" text-anchor="middle">2</text><path d="M105 255L189 255" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="91" y="260" fill="#64748b" font-size="12" font-weight="normal" text-anchor="end">0</text><path d="M105 213L189 213" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="91" y="218" fill="#64748b" font-size="12" font-weight="normal" text-anchor="end">1</text><path d="M105 171L189 171" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="91" y="176" fill="#64748b" font-size="12" font-weight="normal" text-anchor="end">2</text><path d="M100 255L199 255" fill="none" stroke="#64748b" stroke-width="1"/><path d="M105 260L105 161" fill="none" stroke="#64748b" stroke-width="1"/><circle cx="105" cy="255" r="9" fill="#0f766e" stroke="white" stroke-width="2"/><circle cx="105" cy="213" r="9" fill="#b45309" stroke="white" stroke-width="2"/><circle cx="147" cy="255" r="9" fill="#b45309" stroke="white" stroke-width="2"/><circle cx="147" cy="213" r="9" fill="#0f766e" stroke="white" stroke-width="2"/><text x="275" y="114" fill="#0f766e" font-size="16" font-weight="bold" text-anchor="start">输入 (0,0) 和 (1,1) → 0</text><text x="275" y="155" fill="#b45309" font-size="16" font-weight="bold" text-anchor="start">输入 (0,1) 和 (1,0) → 1</text><text x="275" y="207" fill="#64748b" font-size="15" font-weight="normal" text-anchor="start">单条直线无法分开两类</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">MLP 用隐藏层组合多个线性切分，再输出非线性类别概率。</text></g></svg>
