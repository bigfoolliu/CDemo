<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">从文档计数到语言模型评估</title>
  <desc id="description">训练文档与留出文档先分开，训练文档加入 BOS、EOS 并将未知词映射到 UNK，再统计一元词频和二元转移，平滑后评估 NLL、困惑度并采样生成文本。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <style>
      .bg { fill: #f6f7f9; }
      .card { fill: #ffffff; stroke: #cad2dc; stroke-width: 2; rx: 14; }
      .train { fill: #e8f1fb; stroke: #4381bd; }
      .holdout { fill: #eef5ec; stroke: #5b8b54; }
      .count { fill: #fff3df; stroke: #c38a36; }
      .eval { fill: #f2ecf8; stroke: #8869a8; }
      .title { font: 700 25px sans-serif; fill: #263445; }
      .label { font: 700 19px sans-serif; fill: #29384a; }
      .body { font: 16px sans-serif; fill: #465568; }
      .small { font: 14px sans-serif; fill: #58677a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .split { stroke: #8491a0; stroke-dasharray: 7 7; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="430" />
  <text class="title" x="40" y="45">计数式语言模型：训练只统计，测试只评分</text>

  <rect class="card train" x="38" y="100" width="205" height="115" />
  <text class="label" x="62" y="135">训练文档</text>
  <text class="body" x="62" y="168">6 篇原始文本</text>
  <text class="small" x="62" y="193">仅用于建立计数</text>

  <line class="arrow" x1="250" y1="156" x2="300" y2="156" />
  <rect class="card train" x="310" y="100" width="225" height="115" />
  <text class="label" x="334" y="135">编码文档</text>
  <text class="body" x="334" y="168">BOS → 词项 → EOS</text>
  <text class="small" x="334" y="193">词表外映射为 UNK</text>

  <line class="arrow" x1="542" y1="156" x2="592" y2="156" />
  <rect class="card count" x="602" y="88" width="270" height="139" />
  <text class="label" x="627" y="123">统计并加一平滑</text>
  <text class="body" x="627" y="157">一元：C(w)</text>
  <text class="body" x="627" y="186">二元：C(h, w)</text>
  <text class="small" x="627" y="211">每行概率和为 1</text>

  <line class="arrow" x1="879" y1="156" x2="929" y2="156" />
  <rect class="card eval" x="939" y="100" width="220" height="115" />
  <text class="label" x="963" y="135">模型分布</text>
  <text class="body" x="963" y="168">平滑概率与采样</text>
  <text class="small" x="963" y="193">固定种子、有限长度</text>

  <line class="split" x1="280" y1="75" x2="280" y2="300" />
  <text class="small" x="246" y="322">训练 / 测试边界</text>
  <rect class="card holdout" x="38" y="275" width="205" height="105" />
  <text class="label" x="62" y="309">留出文档</text>
  <text class="body" x="62" y="342">2 篇，独立计分</text>
  <text class="small" x="62" y="365">EOS 也作为目标</text>

  <path class="arrow" d="M245 328 C360 328, 440 298, 560 298" />
  <rect class="card eval" x="570" y="263" width="302" height="118" />
  <text class="label" x="595" y="300">负对数似然 NLL</text>
  <text class="body" x="595" y="333">按同一 token 单位平均</text>
  <text class="body" x="595" y="359">PPL = exp(平均 NLL)</text>
  <line class="arrow" x1="879" y1="321" x2="929" y2="321" />
  <rect class="card holdout" x="939" y="275" width="220" height="105" />
  <text class="label" x="963" y="309">比较边界</text>
  <text class="small" x="963" y="342">同词表、分词与 EOS</text>
  <text class="small" x="963" y="365">不外推为通用结论</text>
</svg>
