<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">残差块：学习增量并保留输入</title><desc id="desc">主分支计算 F(x)，捷径把原输入直接加到输出。加法处的梯度会同时流向主分支和恒等捷径。</desc><rect width="760" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif"><text x="30" y="32" fill="#1e293b" font-size="20" font-weight="bold" text-anchor="start">残差块：学习增量并保留输入</text><text x="30" y="56" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">主分支计算 F(x)，捷径把原输入直接加到输出</text><rect x="66" y="127" width="130" height="74" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="131" y="171" fill="#2563eb" font-size="18" font-weight="bold" text-anchor="middle">输入 x</text><path d="M197 164L260 164" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M253.9 167.4L260 164L253.9 160.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="262" y="115" width="200" height="97" rx="10" fill="white" stroke="#cbd5e1"/><text x="362" y="153" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="middle">卷积 → 激活 → 卷积</text><text x="362" y="184" fill="#64748b" font-size="15" font-weight="normal" text-anchor="middle">学习残差 F(x)</text><path d="M463 164L545 164" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M538.9 167.4L545 164L538.9 160.6" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="548" y="127" width="145" height="74" rx="10" fill="#dcfce7" stroke="#86efac"/><text x="620" y="171" fill="#0f766e" font-size="18" font-weight="bold" text-anchor="middle">F(x) + x</text><path d="M131 127V88H517V136" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="320" y="82" fill="#7c3aed" font-size="15" font-weight="bold" text-anchor="middle">恒等捷径：直接传递 x</text><text x="30" y="300" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start">加法处的梯度会同时流向主分支和恒等捷径。</text></g></svg>
