<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">K 近邻分类与回归的对比</title>
  <desc id="desc">左图中，三个最近邻里两个为类别 1，因此预测类别 1。右图中，特征值为 2、3、4 的三个邻居目标值为 4、5、8，等权 KNN 回归预测它们的平均值 5.67。图中数据仅作教学示意。</desc>
  <rect width="1000" height="560" rx="16" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#1e293b">
    <text x="32" y="38" font-size="22" font-weight="700">同样先找邻居，输出方式可以不同</text>
    <text x="32" y="64" font-size="14" fill="#64748b">分类汇总离散标签；回归汇总连续目标值。示意数据不属于项目源码样本。</text>
    <rect x="30" y="88" width="450" height="420" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="520" y="88" width="450" height="420" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="52" y="120" font-size="18" font-weight="700">分类：邻居投票</text>
    <text x="542" y="120" font-size="18" font-weight="700">回归：邻居目标取平均</text>
    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M100 145H420M100 200H420M100 255H420M100 310H420M100 365H420M100 420H420"/>
      <path d="M100 145V420M164 145V420M228 145V420M292 145V420M356 145V420M420 145V420"/>
      <path d="M580 145H930M580 199H930M580 253H930M580 307H930M580 361H930M580 415H930"/>
      <path d="M590 145V415M648 145V415M706 145V415M764 145V415M822 145V415M880 145V415"/>
    </g>
    <path d="M94 420H428M100 426V138" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <path d="M574 415H938M590 421V138" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="100" y="441">0</text><text x="164" y="441">1</text><text x="228" y="441">2</text>
      <text x="292" y="441">3</text><text x="356" y="441">4</text><text x="420" y="441">5</text>
      <text x="590" y="437">1</text><text x="648" y="437">2</text><text x="706" y="437">3</text>
      <text x="764" y="437">4</text><text x="822" y="437">5</text><text x="880" y="437">6</text>
    </g>
    <text x="410" y="462" font-size="12" fill="#64748b">特征 x₁</text>
    <text x="898" y="459" font-size="12" fill="#64748b">特征 x</text>
    <text x="68" y="154" font-size="12" fill="#64748b">x₂</text>
    <text x="548" y="154" font-size="12" fill="#64748b">目标 t</text>
    <g stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4">
      <path d="M311.2 271.5L317.6 310"/><path d="M311.2 271.5L362.4 266"/>
      <path d="M311.2 271.5L234.4 310"/>
    </g>
    <g fill="#0f766e" stroke="#ffffff" stroke-width="2">
      <circle cx="164" cy="348.5" r="7"/><circle cx="234.4" cy="310" r="7"/>
      <circle cx="176.8" cy="244" r="7"/>
    </g>
    <g fill="#c2410c" stroke="#ffffff" stroke-width="2">
      <circle cx="317.6" cy="310" r="8"/><circle cx="362.4" cy="266" r="8"/>
      <circle cx="330.4" cy="189" r="8"/>
    </g>
    <path d="M311.2 261.5L321.2 271.5L311.2 281.5L301.2 271.5Z" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
    <text x="320" y="251" font-size="12" font-weight="700" fill="#6d28d9">查询 q</text>
    <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
      <circle cx="590" cy="361" r="7"/><circle cx="648" cy="307" r="7"/><circle cx="706" cy="289" r="7"/>
      <circle cx="764" cy="235" r="7"/><circle cx="822" cy="217" r="7"/><circle cx="880" cy="163" r="7"/>
    </g>
    <g fill="none" stroke="#c2410c" stroke-width="2.5">
      <circle cx="648" cy="307" r="12"/><circle cx="706" cy="289" r="12"/><circle cx="764" cy="235" r="12"/>
    </g>
    <path d="M735 304V415" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M580 304H930" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M735 294L745 304L735 314L725 304Z" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
    <g font-size="13">
      <text x="52" y="480" fill="#475569">k = 3：标签 1、1、0</text>
      <text x="52" y="499" font-weight="700" fill="#9a3412">两票对一票 → 预测类别 1</text>
      <text x="542" y="480" fill="#475569">邻居目标：4、5、8；特征查询值 x = 3.5</text>
      <text x="542" y="499" font-weight="700" fill="#6d28d9">预测值 = (4 + 5 + 8) / 3 ≈ 5.67</text>
    </g>
  </g>
</svg>
